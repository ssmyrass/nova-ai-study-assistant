body{background:#E6E7F4;position:relative;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
#stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%);transform-origin:center center;border-radius:36px;overflow:hidden;box-shadow:0 18px 40px rgba(23,26,44,.12),0 1px 4px rgba(23,26,44,.08)}
input,textarea,button{font-family:inherit}


a{color:#4B4DED}a:hover{color:#3436C9}
*{-webkit-tap-highlight-color:transparent;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes toast{0%{transform:translateY(-120%);opacity:0}12%{transform:none;opacity:1}88%{transform:none;opacity:1}100%{transform:translateY(-120%);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-4px);opacity:1}}
@keyframes pulse{50%{opacity:.45}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes ring{from{stroke-dashoffset:302}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.scr{animation:up .38s cubic-bezier(.2,.8,.2,1) both}
.st{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:52px;border-radius:14px;letter-spacing:-0.005em;border:none;font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer;transition:transform .12s,filter .15s,background .15s}
.btn:active{transform:scale(.98)}
.pri{background:var(--acc);color:#FFFFFF;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px rgba(23,26,44,.12),0 6px 16px -4px rgba(75,77,237,.45)}
.pri:hover{filter:brightness(1.08)}
.sec{background:#FFFFFF;color:#171A2C;box-shadow:inset 0 0 0 1px #DCDFE8,0 1px 2px rgba(23,26,44,.05)}
.sec:hover{background:#F8F9FC}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border:none;border-radius:20px;background:#FFFFFF;box-shadow:0 1px 2px rgba(23,26,44,.05),0 4px 14px rgba(23,26,44,.04);font-family:'Plus Jakarta Sans',sans-serif;text-align:left;cursor:pointer;transition:transform .14s}
.row:hover{transform:translateY(-1px)}
.row:active{transform:scale(.985)}
.gh{font-size:11px;font-weight:700;letter-spacing:.08em;color:#7A8095;margin:6px 6px 4px}
.grp{background:#FFFFFF;border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px #E9EBF2,0 2px 8px rgba(23,26,44,.04)}
.cell{display:flex;align-items:center;gap:12px;width:100%;padding:5px 14px;border:none;background:#FFFFFF;font-family:'Plus Jakarta Sans',sans-serif;text-align:left;cursor:pointer;transition:background .15s}
.cell:hover{background:#F8F9FC}
.cell:active{background:#F1F2F7}
.sep{height:1px;background:#EEF0F5;margin-left:64px}
.ci{width:38px;height:38px;border-radius:11px;background:#EEEEFD;color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.chip{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.rt{font-size:15px;font-weight:600;color:#171A2C}
.rs{font-size:12px;color:#646A80;margin-top:1px}
.fld{display:flex;align-items:center;gap:10px;height:54px;padding:0 14px;border-radius:16px;background:#F4F5FA;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .15s,background .15s}
.fld:focus-within{background:#FFFFFF;box-shadow:inset 0 0 0 1.5px var(--acc)}
.fld input{flex:1;min-width:0;height:100%;border:none;background:transparent;outline:none;font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;color:#171A2C}
.lb{font-size:13px;font-weight:600;color:#3B4057;margin:4px 2px 0}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:10px 14px;border:none;border-radius:16px;background:#FFFFFF;box-shadow:inset 0 0 0 1.5px #E2E4EE;font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;font-weight:500;color:#171A2C;text-align:left;cursor:pointer;transition:box-shadow .15s,background .15s,transform .12s}
.opt:active{transform:scale(.985)}
.opt.on{background:#F1F1FE;box-shadow:inset 0 0 0 2px var(--acc)}
.ltr{width:32px;height:32px;border-radius:10px;background:#F0F1F6;color:#3B4057;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:none;transition:background .15s,color .15s}
.opt.on .ltr{background:var(--acc);color:#FFFFFF}
.card{background:#FFFFFF;border-radius:22px;padding:18px;box-shadow:0 1px 2px rgba(23,26,44,.05),0 6px 18px rgba(23,26,44,.05)}
.sk{height:12px;border-radius:6px;background:#ECEEF4;animation:pulse 1.2s ease-in-out infinite}
@keyframes novaFloat{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-9px) rotate(4deg)}}
@keyframes novaHop{0%,100%{transform:translateY(0) scale(1.04,.94)}12%{transform:translateY(0) scale(.97,1.04)}50%{transform:translateY(-16px) rotate(6deg)}85%{transform:translateY(0) rotate(-3deg)}}
.nova{animation:novaFloat 2.2s ease-in-out infinite;transform-origin:50% 90%;will-change:transform}
.nova.hop{animation:novaHop 1s cubic-bezier(.3,.7,.4,1) infinite}
.bub{background:#FFFFFF;color:#171A2C;border-radius:20px 20px 20px 6px;padding:12px 14px;box-shadow:0 6px 18px rgba(15,17,40,.12);animation:pop .4s cubic-bezier(.2,.8,.2,1) both}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#FFFFFF;animation:twinkle 2.6s ease-in-out infinite}
.bar{display:block;height:100%;width:100%;border-radius:inherit;transform-origin:left center;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
.sp{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#FFFFFF;border-radius:50%;animation:spin .8s linear infinite}
.d{width:7px;height:7px;border-radius:50%;background:#8B90A7;animation:dot 1.2s infinite}
.ib{width:44px;height:44px;border:none;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.link{border:none;background:none;font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;color:var(--acc);cursor:pointer;padding:10px 4px}

</style>
</head>
<body>
<div id="stage"></div>

  quizData(name, round, mix) {
    // Even rounds use set 1, odd rounds set 2: a new quiz from the same note gets different questions.
    // The question count and difficulty spread come from the quiz setup (easy → medium → hard, 5-10 in total).
    const m = mix || { e: 2, m: 2, h: 1 };
    const n = m.e + m.m + m.h;
    const alt = (round || 0) % 2 === 1;
    const POS = alt ? [2, 3, 0, 1, 2] : [1, 0, 2, 3, 1];
    const A = alt ? this.content2(name) : this.content(name).q;
    const B = alt ? this.content(name).q : this.content2(name);
    const labels = [].concat(Array(m.e).fill('easy'), Array(m.m).fill('medium'), Array(m.h).fill('hard'));
    return A.concat(B).slice(0, n).map(([q, correct, wrong, e, t], i) => {
      const p = POS[i % 5]; const o = wrong.slice(); o.splice(p, 0, correct);
      return { q: q, o: o, c: p, e: e, t: t, d: labels[i] || 'medium' };
    });
  }

  go(screen, extra) {
    this.setState(Object.assign({ screen: screen }, extra || {}));
  }

  later(ms, fn) {
    setTimeout(fn, ms);
