<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Nova sistem mimarisi</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4B4DED"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8B90A7"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#F4F5FA"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#171A2C">Nova · System architecture</text>
  <text x="40" y="80" font-size="15" fill="#646A80">Flutter → REST/JSON → n8n webhook → Ollama (local LLM) + MongoDB · all on Docker Compose</text>

  <!-- Docker boundary -->
  <rect x="300" y="110" width="860" height="500" rx="24" fill="none" stroke="#B4B8C9" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="324" y="140" font-size="14" font-weight="700" fill="#646A80">docker-compose.yml · one command: start.bat / ./start.sh</text>

  <!-- Client -->
  <rect x="40" y="250" width="220" height="210" rx="22" fill="#4B4DED"/>
  <text x="62" y="285" font-size="18" font-weight="700" fill="#fff">Flutter application</text>
  <text x="62" y="312" font-size="13" fill="#E8E8FE">Web (browser) · Android APK</text>
  <text x="62" y="346" font-size="13" fill="#fff">• Sign in / sign up</text>
  <text x="62" y="368" font-size="13" fill="#fff">• Dashboard · My courses</text>
  <text x="62" y="390" font-size="13" fill="#fff">• Course notes · Summary</text>
  <text x="62" y="412" font-size="13" fill="#fff">• Quiz · Result · Advice</text>
  <text x="62" y="434" font-size="13" fill="#fff">• Ask Nova · Statistics</text>

  <!-- nginx -->
  <rect x="330" y="280" width="190" height="150" rx="18" fill="#fff" stroke="#E2E4EE" stroke-width="1.5"/>
  <text x="350" y="314" font-size="17" font-weight="700" fill="#171A2C">web (nginx)</text>
  <text x="350" y="338" font-size="13" fill="#646A80">:8080</text>
  <text x="350" y="366" font-size="13" fill="#3B4057">/  → Flutter web</text>
  <text x="350" y="388" font-size="13" fill="#3B4057">/api/* → n8n webhook</text>
  <text x="350" y="410" font-size="13" fill="#3B4057">CORS · gzip</text>

  <!-- n8n -->
  <rect x="570" y="170" width="300" height="410" rx="20" fill="#fff" stroke="#E2E4EE" stroke-width="1.5"/>
  <rect x="570" y="170" width="300" height="56" rx="20" fill="#FFF1DC"/>
  <rect x="570" y="206" width="300" height="20" fill="#FFF1DC"/>
  <text x="592" y="205" font-size="18" font-weight="700" fill="#7A4600">n8n · workflows</text>
  <text x="790" y="205" font-size="13" fill="#7A4600">:5678</text>
  <g font-size="13" fill="#3B4057">
    <text x="592" y="256">00 Authentication (token, PBKDF2)</text>
    <text x="592" y="286">01 Question answering (RAG + history)</text>
    <text x="592" y="316">02 Note summarisation (TXT/PDF)</text>
    <text x="592" y="346">03 Quiz generation (JSON schema +</text>
    <text x="616" y="364">validation + one retry)</text>
    <text x="592" y="394">04 Performance grading</text>
    <text x="616" y="412">(scoring in code + LLM advice + fallback)</text>
    <text x="592" y="442">05 Dashboard · statistics · weekly plan</text>
    <text x="592" y="472">06 Health check · model list</text>
    <text x="592" y="496">07 Nova Memory · SM-2 spaced repetition</text>
  </g>
  <rect x="592" y="512" width="256" height="54" rx="12" fill="#F4F5FA"/>
  <text x="608" y="534" font-size="12" fill="#646A80">Every endpoint: Webhook → validate → check</text>
  <text x="608" y="554" font-size="12" fill="#646A80">token → work → Respond (JSON)</text>

  <!-- Ollama -->
  <rect x="930" y="170" width="200" height="190" rx="20" fill="#fff" stroke="#E2E4EE" stroke-width="1.5"/>
  <circle cx="962" cy="206" r="14" fill="#FFC94A"/>
  <text x="984" y="212" font-size="18" font-weight="700" fill="#171A2C">Ollama</text>
  <text x="952" y="242" font-size="13" fill="#646A80">:11434 · /api/chat</text>
  <text x="952" y="270" font-size="13" fill="#3B4057">qwen2.5:3b (default)</text>
  <text x="952" y="292" font-size="13" fill="#3B4057">NVIDIA / AMD GPU</text>
  <text x="952" y="314" font-size="13" fill="#3B4057">keep_alive 24h · warm-up</text>
  <text x="952" y="336" font-size="13" fill="#3B4057">format: JSON schema</text>

  <!-- MongoDB -->
  <rect x="930" y="400" width="200" height="180" rx="20" fill="#fff" stroke="#E2E4EE" stroke-width="1.5"/>
  <rect x="952" y="424" width="12" height="20" rx="6" fill="#167A47"/>
  <text x="974" y="440" font-size="18" font-weight="700" fill="#171A2C">MongoDB 7</text>
  <g font-size="13" fill="#3B4057">
    <text x="952" y="470">users · sessions</text>
    <text x="952" y="492">courses · notes (RAG)</text>
    <text x="952" y="514">chats · quizzes</text>
    <text x="952" y="536">results</text>
  </g>
  <text x="952" y="562" font-size="12" fill="#646A80">persistent Docker volume</text>

  <!-- init -->
  <rect x="330" y="470" width="190" height="110" rx="16" fill="#ECEDF4"/>
  <text x="348" y="498" font-size="14" font-weight="700" fill="#3B4057">Start-up jobs</text>
  <text x="348" y="522" font-size="12" fill="#646A80">n8n-import: import the flows,</text>
  <text x="348" y="540" font-size="12" fill="#646A80">activate · Mongo credential</text>
  <text x="348" y="562" font-size="12" fill="#646A80">ollama-init: pull the model + warm it</text>

  <!-- oklar -->
  <path d="M260 355 H322" stroke="#4B4DED" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="268" y="336" font-size="12" font-weight="700" fill="#4B4DED">REST</text>
  <text x="268" y="352" font-size="12" font-weight="700" fill="#4B4DED">JSON</text>
  <path d="M520 355 H562" stroke="#4B4DED" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <path d="M870 265 H922" stroke="#4B4DED" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="874" y="254" font-size="11" font-weight="700" fill="#4B4DED">HTTP</text>
  <path d="M870 490 H922" stroke="#4B4DED" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="874" y="480" font-size="11" font-weight="700" fill="#4B4DED">Mongo</text>
  <path d="M520 525 C545 525 545 560 562 560" stroke="#8B90A7" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#g)"/>
  <text x="40" y="652" font-size="13" fill="#646A80">Demo path: send a note → summary → build a quiz → at least one wrong answer → personal study advice</text>
</svg>
